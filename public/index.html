<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart TV Remote</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
</head>
<body>
    <div class="remote-container">
        <header>
            <button id="cursorBtn" class="btn-cursor" onclick="toggleCursorMode()">🖱️</button>
            <h1>Smart TV</h1>
            <button class="btn-settings" onclick="toggleSettings()">⚙</button>
        </header>

        <div id="settingsModal" class="modal">
            <div class="modal-content">
                <h2>Connection Settings</h2>
                <p>Enter Linux Laptop IP:</p>
                <input type="text" id="ipInput" placeholder="e.g. 192.168.1.23">
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="toggleSettings()">Cancel</button>
                    <button class="btn-action" onclick="saveSettings()">Save & Connect</button>
                </div>
            </div>
        </div>

        <div class="d-pad-container">
            <button class="btn up" onclick="dpad('ArrowUp')">▲</button>
            <div class="middle-row">
                <button class="btn left" onclick="dpad('ArrowLeft')">◀</button>
                <button class="btn ok" onclick="dpad('Enter')">OK</button>
                <button class="btn right" onclick="dpad('ArrowRight')">▶</button>
            </div>
            <button class="btn down" onclick="dpad('ArrowDown')">▼</button>
        </div>

        <button class="btn-back" onclick="sendCommand('BACK')">⬅ Back</button>

        <div class="playback-controls">
            <button class="btn-secondary" onclick="sendCommand('KEY_PRESS', 'Backspace')">Del ⌫</button>
            <button class="btn-secondary" onclick="sendCommand('RELOAD')">Reload</button>
        </div>

        <form class="search-container" onsubmit="event.preventDefault(); sendText();">
            <input type="text" id="searchInput" placeholder="Search / Type..." autocomplete="off">
            <button type="submit" class="btn-action">Send</button>
        </form>

        <div class="quick-launch">
            <button class="btn-launch tv" onclick="toggleChannels()">📺 Channels</button>
        </div>

        <div id="channelsModal" class="modal">
            <div class="modal-content">
                <h2>Channels</h2>
                <div id="channelList" class="channel-list"></div>
                <div class="modal-actions">
                    <button class="btn-secondary" onclick="toggleChannels()">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="socket.io.min.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>
</html>
